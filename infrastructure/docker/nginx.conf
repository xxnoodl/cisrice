server {
    listen 8080;
    server_name localhost;
    client_max_body_size 64k;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    location /api/ { proxy_set_header Host $host; proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
