name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cisrice
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cisrice
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cisrice" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://cisrice:test-only-password@localhost:5432/cisrice
      REDIS_URL: redis://localhost:6379/0
      CISRICE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'pip>=26.2,<27'
      - run: pip install -e './backend[dev]'
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m mypy --config-file backend/pyproject.toml backend/app
      - run: python -m app.core.migrate
        env:
          APP_DATABASE_PASSWORD: ci-runtime-password-at-least-24-chars
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: python -m pytest backend/tests
        env:
          DATABASE_URL: postgresql+psycopg://cisrice_app:ci-runtime-password-at-least-24-chars@localhost:5432/cisrice
      - run: alembic downgrade base
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: python -m pip install 'pip>=26.2,<27'
      - run: pip install -e './backend[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: python infrastructure/scripts/verify_linux.py --e2e
      - run: curl --fail http://localhost:8000/api/health/ready
      - run: curl --fail http://localhost:8080
      - run: docker compose exec -T worker celery -A app.workers.celery_app:celery_app inspect ping --timeout 10
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
