name: cisrice
x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile
  environment:
    DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env first}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    STORAGE_ROOT: ${STORAGE_ROOT:-/data}
    STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-21474836480}
    MINIMUM_FREE_BYTES: ${MINIMUM_FREE_BYTES:-536870912}
    MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-536870912}
    STAGING_RETENTION_HOURS: ${STAGING_RETENTION_HOURS:-24}
    QUARANTINE_RETENTION_DAYS: ${QUARANTINE_RETENTION_DAYS:-0}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}'
    ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173","http://localhost:8000","http://127.0.0.1:8000"]}'
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cisrice
      POSTGRES_USER: cisrice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cisrice -d cisrice"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["python", "-m", "app.core.migrate"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the operator migration database URL}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set a separate runtime database password}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["media_data:/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 5
  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes: ["media_data:/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  dispatcher:
    <<: *backend
    command: ["python", "-m", "app.workers.dispatch"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  storage-init:
    <<: *backend
    user: "0:0"
    cap_add: ["CHOWN", "FOWNER"]
    environment: {}
    volumes: ["media_data:/data"]
    command: ["python", "-c", "import os; os.makedirs('/data', exist_ok=True); os.chown('/data', 10001, 10001); os.chmod('/data', 0o700)"]
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  media_data:
